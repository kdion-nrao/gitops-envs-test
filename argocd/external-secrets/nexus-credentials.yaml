## The Nexus imagePullSecret needs to be replicated to each nemespace that will be pulling images
## We use a single ExternalSecret to pull the values from the remote store, then a
## ClusterSecretStore and a ClusterExternalSecret to replicate that secret to each of the necessary namespaces.
## See: https://external-secrets.io/latest/api/clusterexternalsecret/#reducing-provider-calls-for-large-namespace-sets

## Step 1: A single ExternalSecret pulls from the upstream provider.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: root-nexus-cloud-credentials
  namespace: argocd
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: fake
    kind: ClusterSecretStore
  target:
    name: root-nexus-cloud-credentials
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"nrao.repo.sonatype.app":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}'
  data:
  - secretKey: username
    remoteRef:
      key: /registries/nexus-cloud/username
  - secretKey: password
    remoteRef:
      key: /registries/nexus-cloud/password
---
## Step 2: ClusterSecretStore reads the source Secret via the Kubernetes provider.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: shared-credentials-store
spec:
  provider:
    kubernetes:
      remoteNamespace: argocd
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: argocd
          key: ca.crt
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
---
## Step 3: ClusterExternalSecret fans the Secret out to matching namespaces.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: nexus-cloud-credentials
spec:
  externalSecretName: nexus-cloud-credentials
  namespaceSelectors:
  - matchLabels:
      shared-credentials: "true" 
  externalSecretSpec:
    refreshInterval: "3m"
    secretStoreRef:
      name: shared-credentials-store
      kind: ClusterSecretStore
    target:
      name: nexus-cloud-credentials
      template:
        type: kubernetes.io/dockerconfigjson
    dataFrom:
    - extract:
        key: root-nexus-cloud-credentials
