apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: shared-credentials-store
spec:
  provider:
    kubernetes:
      remoteNamespace: argocd
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: argocd
          key: ca.crt
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
