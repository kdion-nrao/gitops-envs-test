apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: root-nexus-cloud-credentials
  namespace: argocd
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: keeper-secretstore
    kind: ClusterSecretStore
  target:
    name: root-nexus-cloud-credentials
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"nrao.repo.sonatype.app":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}'
  data:
  - secretKey: username
    remoteRef:
      key: 5jhVDFwoGG8sND0lt5WnBg
      property: login
  - secretKey: password
    remoteRef:
      key: 5jhVDFwoGG8sND0lt5WnBg
      property: password
