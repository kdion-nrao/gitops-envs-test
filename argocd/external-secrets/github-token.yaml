apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-token
  namespace: argocd
spec:
  refreshInterval: 12h
  secretStoreRef:
    name: keeper-secretstore
    kind: ClusterSecretStore
  target:
    name: github-token
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: scm-creds
      data:
        token: '{{ .token }}'
  data:
  - secretKey: token
    remoteRef:
      key: "WSNUV6a-3VyqUswWWotIFQ"
      property: note
