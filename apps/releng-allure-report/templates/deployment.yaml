apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "releng-allure-report.fullname" . }}
  labels:
    {{- include "releng-allure-report.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "releng-allure-report.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "releng-allure-report.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ACCESS_TOKEN
              value: {{ .Values.accessToken }}
            - name: SECRET
              value: {{ .Values.secret }}
            - name: MAIN_BRANCH
              value: {{ .Values.mainBranch }}
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            {{- with .Values.storage.local }}
            - name: DATA_DIR
              value: {{ .dir }}
            - name: DATABASE_PATH
              value: {{ .databasePath }}
            {{- end }}
            {{- with .Values.storage.remote }}
            - name: STORAGE_BACKEND
              value: {{ .backend }}
            - name: S3_BUCKET
              value: {{ .bucket }}
            - name: S3_REGION
              value: {{ .region }}
            - name: S3_ENDPOINT
              value: {{ .endpoint }}
            - name: S3_ACCESS_KEY_ID
              value: {{ .accessKey }}
            - name: S3_SECRET_ACCESS_KEY
              value: {{ .secretKey }}
            - name: S3_FORCE_PATH_STYLE
              value: {{ quote .forcePathStyle }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /api/ping
              port: http
            failureThreshold: 10
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
