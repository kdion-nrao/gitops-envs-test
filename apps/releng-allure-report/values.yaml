## Sets the access secrets - OVERRIDE WHEN DEPLOYING
accessToken: change-me
secret: change-me-secret

## Override the URL used for generated tokens
# overrideUrl: https://allure.yoursite.com

storage:
  local:
    dir: /data
    databasePath: /data/reports.sqlite
  remote: {}
    # backend: s3
    # bucket: allure-report-storage
    # region: auto
    # endpoint: https://<cloudflare-account-id>.r2.cloudflarestorage.com
    # accessKey: access-key
    # secretKey: secret-key
    # forcePathStyle: false

## sets the main branch
mainBranch: main

replicaCount: 1

image:
  repository: allure/allure-report-storage
  pullPolicy: IfNotPresent
  tag: "v1.0.0"

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80

livenessProbe:
  httpGet:
    path: /api/ping
    port: http
  initialDelaySeconds: 10

readinessProbe:
  httpGet:
    path: /api/ping
    port: http
  initialDelaySeconds: 10

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    # - host: chart-example.local
    #   paths:
    #     - path: /
    #       pathType: ImplementationSpecific
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

resources: {}

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
