## Sets the access secrets - OVERRIDE WHEN DEPLOYING
accessToken: change-me
secret: change-me-secret

## sets the main branch
mainBranch: main

replicaCount: 1

image:
  repository: allure/allure-report-storage
  pullPolicy: IfNotPresent
  tag: "v1.0.0"

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80

